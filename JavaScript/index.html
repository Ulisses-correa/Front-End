<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculadora-container {
            background: #222;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .display {
            background: #111;
            color: #0f0;
            font-size: 2.5rem;
            text-align: right;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            background: #333;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #555;
        }

        button:active {
            transform: scale(0.95);
        }

        .operador {
            background: #ff9500;
            color: black;
        }

        .operador:hover {
            background: #ffb84d;
        }

        .igual {
            background: #4caf50;
            color: white;
        }

        .igual:hover {
            background: #6bd66f;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculadora-container">
        <h2>Calculadora</h2>

        <div class="display" id="display">0</div>

        <div class="botoes">
            <button onclick="clearDisplay()">CE</button>
            <button onclick="digitar('%')">%</button>
            <button onclick="digitar('+/-')">+/-</button>
            <button class="operador" onclick="digitar('/')">/</button>

            <button onclick="digitar('7')">7</button>
            <button onclick="digitar('8')">8</button>
            <button onclick="digitar('9')">9</button>
            <button class="operador" onclick="digitar('*')">*</button>

            <button onclick="digitar('4')">4</button>
            <button onclick="digitar('5')">5</button>
            <button onclick="digitar('6')">6</button>
            <button class="operador" onclick="digitar('-')">-</button>

            <button onclick="digitar('1')">1</button>
            <button onclick="digitar('2')">2</button>
            <button onclick="digitar('3')">3</button>
            <button class="operador" onclick="digitar('+')">+</button>

            <button onclick="digitar('0')" class="zero">0</button>
            <button onclick="digitar('.')">.</button>
            <button class="igual" onclick="digitar('=')">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById("display");
        let expressao = "";

        function digitar(valor) {

            if (valor === "=") {
                try {
                    expressao = expressao.replace("%", "/100");
                    display.textContent = eval(expressao);
                    expressao = display.textContent;
                } catch {
                    display.textContent = "Erro";
                    expressao = "";
                }
                return;
            }

            if (valor === "+/-") {
                if (expressao) {
                    expressao = String(eval(expressao) * -1);
                    display.textContent = expressao;
                }
                return;
            }

            expressao += valor;
            display.textContent = expressao;
        }

        function clearDisplay() {
            expressao = "";
            display.textContent = "0";
        }
    </script>

</body>
</html>
