<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gerenciador de Times – Versão Aprimorada</title>

<style>
/* =========================== */
/*   ESTILO GERAL DO SISTEMA   */
/* =========================== */

:root{
  --primary:#0078D7;
  --primary-dark:#005a9e;
  --bg:#eef1f5;
  --card:#ffffff;
  --radius:10px;
}

body{
  margin:0;
  background:var(--bg);
  font-family:"Segoe UI", Arial, sans-serif;
}

.win-header{
  background:var(--primary);
  color:#fff;
  padding:18px;
  font-size:22px;
  text-align:center;
  font-weight:600;
  letter-spacing:0.5px;
  box-shadow:0 2px 6px rgba(0,0,0,0.20);
}

.container{max-width:1250px;margin:auto;padding:20px;}

/* CAIXA DE BUSCA */
.search-box{
  background:#fff;
  padding:16px;
  border-radius:var(--radius);
  display:flex;
  gap:10px;
  border:1px solid #ccc;
}
.search-box input{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
}
.search-box button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  background:#e4e4e4;
  font-weight:600;
}
.search-box button.primary{
  background:var(--primary);
  color:white;
}

/* CARDS */
.movie-list{
  display:grid;
  gap:20px;
  margin-top:20px;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
}
.movie-card{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
  border:1px solid #ddd;
}
.movie-card img{
  width:100%;
  height:200px;
  object-fit:contain;
  padding:10px;
  background:#fff;
  border-radius:var(--radius);
}
.movie-card h3{
  margin:10px 0 6px;
  font-size:20px;
  text-align:center;
}
.movie-card p{
  margin:4px 0;
  font-size:14px;
}
.card-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.card-actions button{
  flex:1;
  padding:9px;
  background:#eee;
  border-radius:8px;
  border:1px solid #aaa;
  cursor:pointer;
}

/* =========================== */
/*         MODAL NOVO          */
/* =========================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(3px);
  display:none;
  justify-content:center;
  align-items:center;
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{
  from{opacity:0} to{opacity:1}
}

.modal-content{
  width:450px;
  background:#fff;
  border-radius:var(--radius);
  padding:0;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.40);
  animation:popup .3s ease-out;
}
@keyframes popup{
  from{transform:scale(.85);opacity:0} 
  to{transform:scale(1);opacity:1}
}

/* CABEÇALHO DO MODAL */
.modal-header{
  background:var(--primary);
  color:#fff;
  padding:16px;
  font-size:20px;
  font-weight:600;
}

/* FORMULÁRIO */
.modal-body{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.modal-body label{
  font-weight:600;
  font-size:14px;
}
.modal-body input{
  padding:12px;
  border-radius:8px;
  border:1px solid #bbb;
  font-size:15px;
  background:#fafafa;
}

/* BOTÕES */
.modal-footer{
  padding:16px;
  display:flex;
  gap:12px;
  background:#f4f4f4;
}
.modal-footer button{
  flex:1;
  padding:12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:700;
}
.modal-footer .save{
  background:var(--primary);
  color:white;
}
.modal-footer .cancel{
  background:#ccc;
}
.modal-footer .cancel:hover{
  background:#bbb;
}
.modal-footer .save:hover{
  background:var(--primary-dark);
}

</style>
</head>
<body>

<header class="win-header">Gerenciador de Times – Interface Aprimorada</header>

<div class="container">

<section class="search-box">
  <input id="searchInput" placeholder="Pesquisar time...">
  <button id="btnSearch">Buscar</button>
  <button id="btnListAll">Listar tudo</button>
  <button id="btnAdd" class="primary">+ Adicionar time</button>
</section>

<section id="timeList" class="movie-list"></section>

</div>

<!-- =========================== -->
<!--          MODAL NOVO         -->
<!-- =========================== -->
<div id="modal" class="modal">
  <div class="modal-content">

    <div class="modal-header" id="modalTitle"></div>

    <div class="modal-body">
      <label>Nome do time:</label>
      <input id="nome" type="text" required>

      <label>Cidade:</label>
      <input id="cidade" type="text" required>

      <label>Estádio:</label>
      <input id="estadio" type="text">

      <label>Fundação (Ano):</label>
      <input id="fundacao" type="number">

      <label>Ídolo Máximo:</label>
      <input id="idolo" type="text">

      <label>Escudo (URL da imagem):</label>
      <input id="escudo" type="text">
    </div>

    <div class="modal-footer">
      <button class="save" id="saveBtn">Salvar</button>
      <button class="cancel" id="btnClose">Cancelar</button>
    </div>

  </div>
</div>

<script>

let times = [
  {"Nome":"Vasco da Gama","Cidade":"Rio de Janeiro","Estadio":"Maracanã","Fundacao":"1898","idolo":"Roberto Dinamite","escudo":"imagens/vasco.png"},
  {"Nome":"Flamengo","Cidade":"Rio de Janeiro","Estadio":"Maracanã","Fundacao":"1895","idolo":"Zico","escudo":"imagens/flamerda.jpg"},
  {"Nome":"Palmeiras","Cidade":"São Paulo","Estadio":"Allianz Parque","Fundacao":"1914","idolo":"Marcos","escudo":"imagens/palmeiras.png"},
  {"Nome":"Grêmio","Cidade":"Porto Alegre","Estadio":"Arena do Grêmio","Fundacao":"1903","idolo":"Renato Gaúcho","escudo":"imagens/gremio.png"},
  {"Nome":"Corinthians","Cidade":"São Paulo","Estadio":"Neo Química Arena","Fundacao":"1910","idolo":"Sócrates","escudo":"imagens/corintians.jpg"},
  {"Nome":"Santos","Cidade":"Santos","Estadio":"Vila Belmiro","Fundacao":"1912","idolo":"Pelé","escudo":"imagens/santos.png"},
  {"Nome":"Atlético Mineiro","Cidade":"Belo Horizonte","Estadio":"Mineirão","Fundacao":"1908","idolo":"Reinaldo","escudo":"imagens/atletico.png"},
  {"Nome":"São Paulo FC","Cidade":"São Paulo","Estadio":"Morumbi","Fundacao":"1930","idolo":"Rogério Ceni","escudo":"imagens/download.png"},
  {"Nome":"Internacional","Cidade":"Porto Alegre","Estadio":"Beira-Rio","Fundacao":"1909","idolo":"Falcão","escudo":"imagens/inter.png"},
  {"Nome":"Botafogo","Cidade":"Rio de Janeiro","Estadio":"Nilton Santos","Fundacao":"1904","idolo":"Garrincha","escudo":"imagens/5.png"}
];

let editIndex = null;

/* =========================== */
/*         RENDERIZAÇÃO        */
/* =========================== */

function renderList(lista){
  const area = document.getElementById("timeList");
  area.innerHTML = "";

  lista.forEach((t,i)=>{
    const card = document.createElement("div");
    card.className = "movie-card";

    card.innerHTML = `
      <img src="${t.escudo}">
      <h3>${t.Nome}</h3>
      <p><b>Cidade:</b> ${t.Cidade}</p>
      <p><b>Estádio:</b> ${t.Estadio}</p>
      <p><b>Fundação:</b> ${t.Fundacao}</p>
      <p><b>Ídolo:</b> ${t.idolo}</p>

      <div class="card-actions">
        <button onclick="edit(${i})">Editar</button>
        <button onclick="removeTime(${i})">Excluir</button>
      </div>
    `;

    area.appendChild(card);
  });
}

renderList(times);

/* =========================== */
/*       BUSCA / LISTAGEM      */
/* =========================== */

btnSearch.onclick = ()=>{
  const termo = searchInput.value.toLowerCase();
  renderList(times.filter(t=>t.Nome.toLowerCase().includes(termo)));
};

btnListAll.onclick = ()=>renderList(times);

/* =========================== */
/*            MODAL            */
/* =========================== */

function openModal(titulo){
  document.getElementById("modalTitle").textContent = titulo;
  modal.style.display = "flex";
}

function closeModal(){
  modal.style.display = "none";
}

btnClose.onclick = closeModal;

btnAdd.onclick = ()=>{
  editIndex = null;
  document.getElementById("timeForm")?.reset();
  nome.value="";
  cidade.value="";
  estadio.value="";
  fundacao.value="";
  idolo.value="";
  escudo.value="";
  openModal("Adicionar Novo Time");
};

/* EDITAR */
function edit(i){
  editIndex = i;
  const t = times[i];

  nome.value = t.Nome;
  cidade.value = t.Cidade;
  estadio.value = t.Estadio;
  fundacao.value = t.Fundacao;
  idolo.value = t.idolo;
  escudo.value = t.escudo;

  openModal("Editar Time");
}

/* SALVAR */
saveBtn.onclick = ()=>{
  const novo = {
    Nome:nome.value,
    Cidade:cidade.value,
    Estadio:estadio.value,
    Fundacao:fundacao.value,
    idolo:idolo.value,
    escudo:escudo.value
  };

  if(editIndex === null){
    times.push(novo);
  } else {
    times[editIndex] = novo;
  }

  closeModal();
  renderList(times);
};

/* REMOVER */
function removeTime(i){
  if(confirm("Tem certeza que deseja excluir este time?")){
    times.splice(i,1);
    renderList(times);
  }
}

</script>

</body>
</html>
