<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times de Futebol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
        }

        /* área da pesquisa */
        #pesquisa {
            width: 60%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 1rem;
        }

        /* Tabela menor e centralizada */
        .tabela-container {
            width: 60%;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #ececec;
        }

        tr:hover {
            background: #d6eaff;
        }
    </style>
</head>

<body>

    <h1>Times de Futebol</h1>

    <!-- Campo de pesquisa -->
    <input type="text" id="pesquisa" placeholder="Pesquisar por nome do time...">

        <!-- Área de busca -->
    <section class="search-box">

        <button id="btnSearch">Buscar</button>
        <button id="btnListAll">Listar Tudo</button>
        <button id="btnAdd">Adicionar Novo Filme</button>
    </section>

    <div class="tabela-container">
        <table id="tabelaTimes">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cidade</th>
                    <th>Estádio</th>
                    <th>Fundação</th>
                    <th>Ídolo</th>
                </tr>
            </thead>
            <!-- Popup Modal para adicionar/editar -->
<div id="modal" class="modal">
    <div class="modal-content">

        <h2 id="modalTitle">Editar Filme</h2>

        <form id="movieForm">
            <label>Nome:</label>
            <input type="text" id="nome">

            <label>Ano Fundação:</label>
            <input type="number" id="number>

            <label>Duração:</label>
            <input type="text" id="duracao">

            <label>Cidade:</label>
            <input type="text" id="classificacao">

            <label>Estádio:</label>
            <input type="text" id="diretor">

            <label>Escudo:</label>
            <input type="text" id="capa">

            <label>Titulo Imprtante:</label>
            <textarea id="sinopse"></textarea>

            <label>Idolo:</label>
            <textarea id="elenco"></textarea>

            <div class="modal-btns">
                <button type="submit">Salvar</button>
                <button type="button" id="btnClose">Cancelar</button>
            </div>
        </form>

    </div>
</div>
            <tbody>
                <!-- Linhas serão carregadas pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        let listaTimes = [];

        // Carregar JSON
        fetch("./times.json")
            .then(response => response.json())
            .then(data => {
                listaTimes = data.Times; 
                atualizarTabela(listaTimes);
            })
            .catch(error => console.error("Erro ao carregar JSON:", error));

        // Função para preencher tabela
        function atualizarTabela(times) {
            const tabela = document.querySelector("#tabelaTimes tbody");
            tabela.innerHTML = ""; // limpa tabela

            times.forEach(time => {
                const linha = document.createElement("tr");

                linha.innerHTML = `
                    <td>${time.Nome}</td>
                    <td>${time.Cidade}</td>
                    <td>${time.Estadio}</td>
                    <td>${time.Fundacao}</td>
                    <td>${time.idolo}</td>
                `;

                tabela.appendChild(linha);
            });
        }

        // Barra de pesquisa funcionando
        document.getElementById("pesquisa").addEventListener("input", function () {
            const termo = this.value.toLowerCase();

            const filtrados = listaTimes.filter(time =>
                time.Nome.toLowerCase().includes(termo)
            );

            atualizarTabela(filtrados);
        });
    </script>   

</body>
</html>
